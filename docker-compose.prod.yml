# Production Docker Compose Configuration
#
# Usage:
#   1. Deploy: ./deploy-prod.sh
#
# Or manual steps:
#   1. Build frontend: docker compose build frontend
#   2. Generate static files: docker compose run --rm frontend npm run build
#   3. Deploy: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # In production, frontend container is not needed (static files served by Caddy)
  # We override it to just stay alive without running dev server
  frontend:
    build:
      context: ./frontend
    # Don't run dev server, just keep container alive for dependency
    command: ["sh", "-c", "echo 'Production mode: Frontend served by Caddy' && tail -f /dev/null"]
    # No ports exposed in production (Caddy serves static files)
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  caddy:
    # Use production Caddyfile with security headers and caching
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    # Remove dependency on frontend (it just needs dist folder)
    depends_on:
      - web
