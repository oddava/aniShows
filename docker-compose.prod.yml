# Production Docker Compose Configuration

services:
  web:
    image: ghcr.io/oddava/anishows-backend:latest
    command: >
      uv run gunicorn root.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gthread --threads 4 --worker-connections 1000 --max-requests 1000 --max-requests-jitter 100 --timeout 30 --keep-alive 5 --access-logfile - --error-logfile - --log-level warning
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=5).close()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  redis:
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword123} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  celery:
    image: ghcr.io/oddava/anishows-backend:latest
    command: [ "uv", "run", "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,low_priority,notifications", "--concurrency=1", "--pool=solo", "--max-tasks-per-child=1000" ]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - frontend_dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    restart: always
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb myminio/$${BUCKET_NAME} --ignore-existing;
      mc anonymous set download myminio/$${BUCKET_NAME}/media;
      exit 0;
      "

  beat:
    image: ghcr.io/oddava/anishows-backend:latest
    command: [ "uv", "run", "celery", "-A", "root", "beat", "--loglevel=info" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      DJANGO_SETTINGS_MODULE: "root.settings"
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  grafana:
    deploy:
      replicas: 0

volumes:
  frontend_dist:
