# Production Docker Compose Configuration for EC2
#
# Usage:
#   1. Build: docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   2. Deploy: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optimized for small EC2 instances (2 vCPU, 2-4GB RAM)

services:
  # Frontend - Production build served by Caddy
  frontend:
    build:
      context: ./frontend
      args:
        - NODE_ENV=production
    command: ["sh", "-c", "echo 'Production mode: Frontend served by Caddy' && tail -f /dev/null"]
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Web - Optimized Gunicorn settings for small EC2 (t2.micro - 1 vCPU)
  web:
    command: >
      uv run gunicorn root.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --worker-class gthread
      --threads 4
      --worker-connections 1000
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 30
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level warning
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # Redis - Optimized for profile caching with 512MB and persistence
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Celery - Reduced concurrency for EC2
  celery:
    command: ["uv", "run", "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,low_priority,notifications", "--concurrency=1", "--pool=solo", "--max-tasks-per-child=1000"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Caddy - Production configuration
  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO - Required for production media storage
  minio:
    image: minio/minio:latest
    restart: always
    expose:
      - "9000"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Beat - Required for scheduled tasks (user stats updates, cache warming)
  beat:
    image: anishows_web:latest
    command: ["uv", "run", "celery", "-A", "root", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      DJANGO_SETTINGS_MODULE: "root.settings"
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Disable Grafana in production (not needed)
  grafana:
    deploy:
      replicas: 0

  # Remove unnecessary services for small EC2
  # backup:  # Use AWS automated backups instead
