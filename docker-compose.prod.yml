# Production Docker Compose Configuration for EC2
#
# Usage:
#   1. Build: docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   2. Deploy: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optimized for small EC2 instances (2 vCPU, 2-4GB RAM)

services:
  # Frontend - Production build served by Caddy
  frontend:
    build:
      context: ./frontend
      args:
        - NODE_ENV=production
    command: ["sh", "-c", "echo 'Production mode: Frontend served by Caddy' && tail -f /dev/null"]
    ports: []
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Web - Optimized Gunicorn settings for EC2
  web:
    command: >
      uv run gunicorn root.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --worker-class gthread
      --threads 4
      --worker-connections 1000
      --max-requests 10000
      --max-requests-jitter 100
      --timeout 60
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level warning
      --preload
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # Redis - Memory optimized for small instances
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword123}
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""

  # Celery - Reduced concurrency for EC2
  celery:
    command: ["uv", "run", "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,low_priority", "--concurrency=1", "--pool=solo", "--max-tasks-per-child=1000"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Caddy - Production configuration
  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Remove unnecessary services for small EC2
  # Comment out services you don't need:
  # beat:  # Uncomment if you need scheduled tasks
  # backup:  # Use AWS automated backups instead
  # minio:  # Use AWS S3 in production
