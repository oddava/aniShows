# Production Docker Compose Configuration

services:
  web:
    image: ghcr.io/oddava/anishows-backend:latest
    restart: always
    command: gunicorn root.asgi:application -c gunicorn.conf.py
    volumes:
      - prometheus_multiproc:/tmp/prometheus
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "production"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  redis:
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword123} --maxmemory 200mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000 --tcp-backlog 511 --hz 10
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  celery:
    image: ghcr.io/oddava/anishows-backend:latest
    restart: always
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,batch,analytics,low_priority", "--concurrency=2", "--pool=prefork", "--max-tasks-per-child=500", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
      DJANGO_SETTINGS_MODULE: "root.settings"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "production"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  celery_priority:
    image: ghcr.io/oddava/anishows-backend:latest
    restart: always
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "critical,high_priority,notifications,images", "--concurrency=2", "--pool=prefork", "--max-tasks-per-child=500", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
      DJANGO_SETTINGS_MODULE: "root.settings"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "production"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # Daphne ASGI Server - WebSocket connections (production)
  daphne:
    image: ghcr.io/oddava/anishows-backend:latest
    restart: always
    command: [ "daphne", "-b", "0.0.0.0", "-p", "8001", "root.asgi:application" ]
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DJANGO_ENV: "production"
      DJANGO_SETTINGS_MODULE: "root.settings"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "production"
    # Disable the Dockerfile HEALTHCHECK (it targets port 8000 / Gunicorn)
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - frontend_dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      daphne:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    restart: always
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD}; mc mb myminio/$${BUCKET_NAME} --ignore-existing; mc anonymous set download myminio/$${BUCKET_NAME}/media; exit 0; "

  beat:
    image: ghcr.io/oddava/anishows-backend:latest
    restart: always
    command: [ "celery", "-A", "root", "beat", "--loglevel=info" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-0}"
      DJANGO_SETTINGS_MODULE: "root.settings"
    depends_on:
      web:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  grafana:
    deploy:
      replicas: 0

volumes:
  frontend_dist:
