# Production stack. Standalone: run with `docker compose -f docker-compose.prod.yml ...`
# (deploy-prod.sh does this and picks the profiles and override files below).
# Service and volume names match the previous layout so existing data volumes
# and the compose network are reused.
#
# Object storage is NOT part of this stack: media lives in the RustFS already
# running on the host (bucket anishows-media, a bucket-scoped user, anonymous
# read on media/* only; provisioned by infra, not here). The stack reaches it
# as http://rustfs:9000 over the external, internal-only Docker network
# S3_NETWORK (default anishows-s3), which web, celery, beat, caddy and backup
# join. `manage.py s3_check` (deploy-prod.sh "Object storage") proves the
# credentials, the bucket and the network before anything is changed.
#
# Profiles (COMPOSE_PROFILES, set by deploy-prod.sh):
#   bundled-db  the local Postgres `db` (when DB_HOST=db, the default)
#   analytics   Umami + its database
#   tunnel      cloudflared (Cloudflare Tunnel), when CADDY_MODE=tunnel
# Override files (infra/compose/, added by deploy-prod.sh):
#   proxy-port.yml             Caddy on 127.0.0.1:CADDY_PROXY_PORT for the host's
#                              existing reverse proxy (CADDY_MODE=proxy, the default)
#   shared-proxy-network.yml   Caddy joins that proxy's Docker network instead
#   public-ports.yml           Caddy publishes 80/443 (CADDY_MODE=public)
#   loopback-port.yml          Caddy on 127.0.0.1:CADDY_LOOPBACK_PORT (host-run cloudflared)
#   shared-tunnel-network.yml  Caddy joins an existing cloudflared network
# With none of them, nothing publishes a host port.
#
# Trusted peers have no permissive defaults: TRUSTED_PROXY_CIDRS (Django's,
# below) must be set or Compose refuses the file, and deploy-prod.sh refuses
# to start without CADDY_TRUSTED_PROXIES in proxy mode (scripts/deploy/env.sh).
#
# Gunicorn runs uvicorn workers, which serve both HTTP and WebSockets.
# BACKEND_TAG pins the backend image (defaults to latest, CI also pushes sha-<commit>).
# Footprint: the defaults are the lean shared-host profile, about 3 GB of limits
# with the bundled db (one web replica with 2 gunicorn workers, celery
# concurrency 1); docs/deploy/runbook.md has the table and a roomier profile.
#
# Restart: RESTART_POLICY, default unless-stopped. Docker backs off between
# restarts (100 ms doubling up to 1 min), so a crash loop costs at most about
# one restart a minute, and a stopped service stays stopped. on-failure:N caps
# the count, but Docker does not restart a container that exited cleanly when
# the host reboots (gunicorn and celery exit 0 on SIGTERM), so it needs a boot
# hook (runbook); that is why it is not the default.

x-logging: &logging
  # Docker's default json-file driver never rotates; on a shared host that
  # fills the disk. 5 x 10 MB per container.
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

x-backend: &backend
  image: ghcr.io/oddava/anishows-backend:${BACKEND_TAG:-latest}
  restart: ${RESTART_POLICY:-unless-stopped}
  env_file: .env
  environment:
    DJANGO_ENV: production
    # External/shared Postgres: set DB_HOST (and DB_SSLMODE) in .env and drop
    # the bundled-db profile. Default: the bundled `db` service.
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: ${DB_PORT:-5432}
    DB_SSLMODE: ${DB_SSLMODE:-}
    DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    # The host's RustFS over the s3 network; .env can point elsewhere.
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://rustfs:9000}
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_STORAGE_BUCKET_NAME and
    # AWS_S3_REGION_NAME come from .env (env_file above); no built-in defaults.
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    # Lean profile: 2 gunicorn workers per web replica (gunicorn.conf.py would
    # otherwise use the CPU count, 2..4). Only web reads it.
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    SENTRY_ENVIRONMENT: production
    # Only Caddy can reach the backend (it publishes no ports), and Caddy
    # sends exactly one X-Forwarded-For entry: the real client. Without this,
    # every request looks like it came from Caddy's container IP (throttles,
    # logs, view counts, audit). No default: set it to Caddy's network,
    # APP_SUBNET (the `default` network below).
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS in .env to APP_SUBNET (docs/deploy/DEPLOY.md)}
  user: "1000:1000"
  logging: *logging
  depends_on: &backend-deps
    db:
      condition: service_healthy
      # Not started with an external DB_HOST (bundled-db profile off).
      required: false
    redis:
      condition: service_healthy
  # default: db and redis; s3: the host's RustFS.
  networks:
    default: {}
    s3: {}

services:
  web:
    <<: *backend
    command: ["bash", "/app/scripts/run_with_migration_check.sh", "gunicorn", "root.asgi:application", "-c", "gunicorn.conf.py"]
    expose:
      - "8000"
    volumes:
      - prometheus_multiproc:/tmp/prometheus
      # The deployed SPA (read-only): /anime/* and /u/* are served from its
      # index.html with their own <head> (apps/core/spa_shell.py).
      - frontend_dist:/srv/frontend:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-512M}

  celery:
    <<: *backend
    command: >
      celery -A root worker -l WARNING -O fair --pool=prefork
      --concurrency=${CELERY_CONCURRENCY:-1}
      --max-tasks-per-child=200 --max-memory-per-child=384000
      -Q critical,high_priority,default,notifications,batch,images,analytics,low_priority
    # No healthcheck: `celery inspect ping` boots a second Django process
    # (~150 MB) inside the worker's memory limit every interval.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: ${CELERY_MEMORY_LIMIT:-640M}

  beat:
    <<: *backend
    command: ["celery", "-A", "root", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: ${BEAT_MEMORY_LIMIT:-192M}

  db:
    profiles: [bundled-db]
    image: postgres:18-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1}
      POSTGRES_DB: ${DB_NAME:-anishows_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anishows_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-768M}

  redis:
    # Cache, Celery broker and channel layer share this Redis. volatile-lru
    # evicts only keys with a TTL (the cache's), never the broker's queues and
    # bindings, which have none; when only TTL-less keys remain, writes fail
    # (OOM) instead of silently dropping tasks.
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword123}
      --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
      --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          # maxmemory plus room for the AOF-rewrite fork and client buffers.
          memory: ${REDIS_MEMORY_LIMIT:-256M}

  caddy:
    image: caddy:alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    # No host ports here: infra/compose/proxy-port.yml (proxy mode) or
    # public-ports.yml (public mode) adds them; tunnel mode reaches Caddy
    # over the edge network only.
    # No env_file: the edge container gets only what the Caddyfile reads.
    # Use scripts/deploy/compose.sh (or deploy-prod.sh): it derives the
    # CADDY_* values from CADDY_MODE. The defaults below are proxy mode.
    environment:
      CADDY_MODE: ${CADDY_MODE:-proxy}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@anishows.local}
      UMAMI_PUBLIC_ORIGIN: ${UMAMI_PUBLIC_ORIGIN:-}
      WEB_UPSTREAMS: ${WEB_UPSTREAMS:-web:8000}
      # Proxy and tunnel: ":80" (plain HTTP, no ACME). Public: the domain (ACME).
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_UMAMI_SITE_ADDRESS: ${CADDY_UMAMI_SITE_ADDRESS:-${UMAMI_DOMAIN:-http://umami.invalid}}
      # Peers allowed to set the client IP and scheme. Proxy mode: the host's
      # reverse proxy as Caddy sees it (required; no default). Tunnel mode
      # with the in-stack cloudflared: the edge subnet + loopback. Public
      # mode: loopback only. Unset, only loopback is trusted.
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/8 ::1/128}
      # Where a trusted peer puts the client IP: X-Forwarded-For (proxy,
      # read right to left past trusted peers), CF-Connecting-IP (tunnel).
      CADDY_CLIENT_IP_HEADERS: ${CADDY_CLIENT_IP_HEADERS:-X-Forwarded-For}
      CADDY_HSTS_HEADER: ${CADDY_HSTS_HEADER:-max-age=31536000}
      # D-9 gate for /metrics, readiness, /django-admin (space-separated CIDRs).
      # Empty = 100::/64 (RFC 6666 discard prefix: no client has it), so only
      # Caddy's own loopback (deploy smoke tests) passes: closed to
      # every client. deploy-prod.sh refuses wide-open values.
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-100::/64}
      # /media is proxied to the host's RustFS (s3 network): its address and
      # the bucket whose media/ prefix is public.
      S3_UPSTREAM: ${S3_UPSTREAM:-rustfs:9000}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-${AWS_STORAGE_BUCKET_NAME:-anishows-media}}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/sites-proxy.d:/etc/caddy/sites-proxy.d:ro
      - ./infra/caddy/sites-public.d:/etc/caddy/sites-public.d:ro
      - ./infra/caddy/sites-tunnel.d:/etc/caddy/sites-tunnel.d:ro
      - frontend_dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default: {}
      edge: {}
      s3: {}
    healthcheck:
      # The admin API answers once the config is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-128M}

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    # Remotely managed tunnel: the public hostnames and their service
    # (http://caddy:80) live in the Cloudflare dashboard; the token is the
    # only secret. See infra/cloudflared/ for a locally managed config.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    # Only on the edge network: it reaches caddy:80 and nothing else of ours,
    # and its address is the only non-loopback peer Caddy trusts.
    networks:
      - edge
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      caddy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CLOUDFLARED_MEMORY_LIMIT:-128M}

  umami_db:
    profiles: [analytics]
    image: postgres:${UMAMI_POSTGRES_VERSION:-17}-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    environment:
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${UMAMI_DB_MEMORY_LIMIT:-256M}

  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami_db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    depends_on:
      umami_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${UMAMI_MEMORY_LIMIT:-512M}

  backup:
    build: ./backups
    image: anishows-backup:local
    container_name: anishows-backup
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging
    env_file: .env
    environment:
      # Dumps whichever Postgres the app uses (bundled or external).
      POSTGRES_HOST: ${DB_HOST:-db}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${DB_NAME:-anishows_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1}
      PGSSLMODE: ${DB_SSLMODE:-prefer}
      # verify-full: the CA path inside the container (infra/compose/db-ca.yml).
      PGSSLROOTCERT: ${DB_SSLROOTCERT:-}
      # Media backups read the bucket over S3 (rclone); the credentials and
      # AWS_STORAGE_BUCKET_NAME / AWS_S3_REGION_NAME come from .env.
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://rustfs:9000}
    depends_on:
      db:
        condition: service_started
        required: false
    volumes:
      - ./backups-data:/backups
    networks:
      default: {}
      s3: {}
    healthcheck:
      # Unhealthy when no scheduled/manual backup succeeded in 26 h (after a
      # first day of grace), so a failing nightly shows in `compose ps`.
      test: ["CMD", "bash", "/app/shell/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 1
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-256M}

networks:
  # The app network, at a fixed subnet so TRUSTED_PROXY_CIDRS (Django trusts
  # Caddy's address on it) and, in proxy mode, CADDY_TRUSTED_PROXIES (its
  # gateway, where the host's proxy connects from) can name it exactly.
  # Change APP_SUBNET if it overlaps a network on the host.
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.250.250.0/25}
  # Caddy <-> cloudflared only. A fixed subnet, so Caddy can trust exactly it;
  # change EDGE_SUBNET if it overlaps a network on the host.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.250.250.240/29}
  # The host's RustFS (http://rustfs:9000). Created once by infra, internal
  # only, so it is external: Compose neither creates nor removes it.
  s3:
    name: ${S3_NETWORK:-anishows-s3}
    external: true

volumes:
  db_data:
  redis_data:
  frontend_dist:
  prometheus_multiproc:
  caddy_data:
  caddy_config:
  umami_db_data:
