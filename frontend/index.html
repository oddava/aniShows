<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=2" />
  <link rel="shortcut icon" type="image/svg+xml" href="/icon.svg?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="AniShows - Discover your next anime adventure. Explore thousands of anime series, track your favorites, and join a community of passionate fans." />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- Preload critical font -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

  <!-- Critical CSS - prevents white flash -->
  <style>
    html, body {
      background-color: #0f0f0f !important;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    #root {
      background-color: #0f0f0f;
      min-height: 100vh;
    }
    /* Loading animation */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .initial-loader::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #262626;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: initial-spin 0.8s linear infinite;
    }
    @keyframes initial-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5H6MY8PLZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-F5H6MY8PLZ');
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://anishows.com/" />
  <meta property="og:title" content="AniShows - Anime Discovery Platform" />
  <meta property="og:description"
    content="Discover your next anime adventure. Track your favorites, write reviews, and join the community." />
    <meta property="og:image" content="https://anishows.com/icon.svg?v=2" />
  <meta property="og:image:type" content="image/svg+xml" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://anishows.com/" />
  <meta property="twitter:title" content="AniShows - Anime Discovery Platform" />
  <meta property="twitter:description"
    content="Discover your next anime adventure. Track your favorites, write reviews, and join the community." />
    <meta property="twitter:image" content="https://anishows.com/icon.svg?v=2" />

  <title>AniShows - Discover & Track Anime | Anime Database & Community</title>
  
  <!-- Canonical Tag -->
  <link rel="canonical" href="https://anishows.com/" />

  <!-- Structured Data for Logo -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AniShows",
    "url": "https://anishows.com",
    "logo": "https://anishows.com/icon.svg?v=2",
    "sameAs": []
  }
  </script>
</head>

<body>
  <div id="root">
    <div class="initial-loader" id="initial-loader"></div>
  </div>
  <script>
    // Safety net for stale service-worker caches after deployments.
    (function () {
      var pwaEnabledMeta = document.querySelector('meta[name="pwa-enabled"]');
      var pwaEnabled = pwaEnabledMeta && pwaEnabledMeta.getAttribute('content') === 'true';
      if (pwaEnabled) {
        return;
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function () {});
      }
      if ('caches' in window) {
        caches.keys()
          .then(function (keys) {
            return Promise.all(keys
              .filter(function (key) {
                return key.includes('workbox') || key.includes('precache') || key.includes('vite-pwa');
              })
              .map(function (key) {
                return caches.delete(key);
              }));
          })
          .catch(function () {});
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Hide initial loader once React mounts
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function() {
            loader.remove();
          }, 300);
        }
      }, 100);
    });
  </script>
</body>

</html>
