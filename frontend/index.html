<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="/anishows-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/anishows-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="AniShows - Discover your next anime adventure. Explore thousands of anime series, track your favorites, and join a community of passionate fans." />
  <meta name="theme-color" content="#15181d" />

  <!-- Font: DM Sans, self-hosted (@fontsource-variable/dm-sans in main.jsx). -->

  <!-- Posters fall back to this host when a self-hosted copy is missing:
       open the connection early. -->
  <link rel="preconnect" href="https://cdn.myanimelist.net" />

  <!-- Critical CSS - prevents white flash -->
  <style>
    html, body {
      background-color: #15181d !important;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    #root {
      background-color: #15181d;
      min-height: 100vh;
    }
    /* Loading animation */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #15181d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .initial-loader::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid rgba(141, 177, 255, 0.16);
      border-top-color: #8db1ff;
      border-radius: 50%;
      /* Only a slow boot shows the spinner; a quick one goes straight from
         the blank page colour to the page. */
      opacity: 0;
      animation: initial-spin 0.8s linear infinite, initial-show 0.2s ease-out 0.4s forwards;
    }
    @keyframes initial-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes initial-show {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .initial-loader::after { animation: initial-show 0.2s ease-out 0.4s forwards; }
    }
  </style>

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="AniShows" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://anishows.com/" />
  <meta property="og:title" content="AniShows - Anime Discovery Platform" />
  <meta property="og:description"
    content="Discover your next anime adventure. Track your favorites, write reviews, and join the community." />
  <!-- A 1200x630 card (the standard link-preview size); the square icon was
    shown letterboxed on white by Telegram and others. -->
  <meta property="og:image" content="https://anishows.com/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AniShows: discover, track and talk about anime" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://anishows.com/" />
  <meta name="twitter:title" content="AniShows - Anime Discovery Platform" />
  <meta name="twitter:description"
    content="Discover your next anime adventure. Track your favorites, write reviews, and join the community." />
  <meta name="twitter:image" content="https://anishows.com/og-image.png" />
  <meta name="twitter:image:alt" content="AniShows: discover, track and talk about anime" />

  <title>AniShows - Discover & Track Anime | Anime Database & Community</title>
  
  <!-- Canonical Tag -->
  <link rel="canonical" href="https://anishows.com/" />

  <!-- Structured Data for Logo -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AniShows",
    "url": "https://anishows.com",
    "logo": "https://anishows.com/anishows-icon-512.png",
    "sameAs": []
  }
  </script>
</head>

<body>
  <div id="root">
    <div class="initial-loader" id="initial-loader"></div>
  </div>
  <script src="/boot.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
