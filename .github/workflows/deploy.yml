name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # LINTING & SECURITY CHECKS
  # =============================================================================
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies from lock file
        run: |
          echo "📦 Installing dependencies from uv.lock..."
          uv pip sync --system uv.lock

      - name: Install dev dependencies
        run: |
          echo "📦 Installing dev dependencies..."
          uv pip install --system \
            ruff>=0.6.9 \
            mypy>=1.11.2 \
            django-stubs>=5.1.0 \
            djangorestframework-stubs>=3.15.0 \
            bandit>=1.7.10 \
            safety>=3.2.0

      - name: Run Ruff linting
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check apps/ root/ --output-format=github

      - name: Run Ruff formatting check
        run: |
          echo "🔍 Checking code formatting..."
          ruff format --check apps/ root/

      - name: Run Bandit security scan
        run: |
          echo "🔒 Running security scan..."
          bandit -r apps/ -f json -o bandit-report.json || true
          bandit -r apps/ -ll

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

      - name: Run mypy type checking
        run: |
          echo "🔍 Running type checks..."
          mypy apps/ root/ --show-error-codes --ignore-missing-imports

  # =============================================================================
  # TESTS
  # =============================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_anishows
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies from lock file
        run: |
          echo "📦 Installing dependencies from uv.lock..."
          uv pip sync --system uv.lock

      - name: Install dev dependencies
        run: |
          echo "📦 Installing dev dependencies..."
          uv pip install --system \
            pytest>=8.3.0 \
            pytest-django>=4.9.0 \
            pytest-cov>=5.0.0 \
            factory-boy>=3.3.0 \
            freezegun>=1.5.0

      - name: Run Django system checks
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_anishows
          REDIS_URL: redis://localhost:6379/0
        run: |
          echo "🔍 Running Django system checks..."
          python manage.py check --deploy --fail-level=WARNING

      - name: Run migrations check
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_anishows
          REDIS_URL: redis://localhost:6379/0
        run: |
          echo "🔍 Checking for migration issues..."
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_anishows
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-not-for-production
        run: |
          echo "🧪 Running tests..."
          pytest --cov=apps --cov-report=xml --cov-report=html -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Check coverage threshold
        run: |
          echo "📊 Checking coverage threshold..."
          coverage report --fail-under=50 || echo "⚠️ Coverage below 50%"

  # =============================================================================
  # BUILD & PUSH DOCKER IMAGES
  # =============================================================================
  build:
    needs: [lint-and-security, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t anishows:${{ github.sha }} -t anishows:latest .
          
      - name: Test Docker image
        run: |
          echo "🧪 Testing Docker image..."
          docker run --rm anishows:${{ github.sha }} python --version
          docker run --rm anishows:${{ github.sha }} python -c "import django; print(django.get_version())"

  # =============================================================================
  # DEPLOY TO PRODUCTION
  # =============================================================================
  deploy:
    needs: [lint-and-security, test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
          log-public-key: false

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          echo "🚀 Starting deployment to EC2..."
          
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            
            echo "📂 Navigating to project directory..."
            cd /home/ubuntu/aniShows
            
            echo "🔄 Stashing any local changes..."
            git stash || true
            
            echo "🔄 Pulling latest changes from GitHub..."
            git pull origin main
            
            echo "🐳 Running deployment script..."
            ./deploy-prod.sh
            
            echo "✅ Deployment completed successfully!"
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
          exit 1

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Successfully deployed commit ${{ github.sha }} to production"
