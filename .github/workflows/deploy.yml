name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anishows-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anishows-frontend

jobs:
  # =============================================================================
  # LINTING & SECURITY CHECKS
  # =============================================================================
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          uv pip install --system setuptools wheel
          uv pip install --system ".[dev]"

      - name: Run Ruff linting
        continue-on-error: true
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check apps/ root/ --output-format=github

      - name: Run Ruff formatting check
        continue-on-error: true
        run: |
          echo "🔍 Checking code formatting..."
          ruff format --check apps/ root/

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          echo "🔒 Running security scan..."
          bandit -r apps/ -f json -o bandit-report.json || true
          bandit -r apps/ -ll

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

      - name: Run mypy type checking
        continue-on-error: true
        run: |
          echo "🔍 Running type checks..."
          mypy apps/ root/ --show-error-codes --ignore-missing-imports

  # =============================================================================
  # FRONTEND CHECKS
  # =============================================================================
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        continue-on-error: true
        run: npm run lint

      - name: Run Type Check & Build
        run: npm run build

  # =============================================================================
  # TESTS
  # =============================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_anishows
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          uv pip install --system setuptools wheel
          uv pip install --system ".[dev]"

      - name: Run Django system checks
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DB_NAME: test_anishows
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DJANGO_SECRET_KEY: test-secret-key-not-for-production
        run: |
          echo "🔍 Running Django system checks..."
          python manage.py check --fail-level=WARNING

      - name: Run migrations check
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DB_NAME: test_anishows
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DJANGO_SECRET_KEY: test-secret-key-not-for-production
        run: |
          echo "🔍 Checking for migration issues..."
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: root.settings.test
          DB_NAME: test_anishows
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DJANGO_SECRET_KEY: test-secret-key-not-for-production
        run: |
          echo "🧪 Running tests..."
          pytest --cov=apps --cov-report=xml --cov-report=html -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Check coverage threshold
        run: |
          echo "📊 Checking coverage threshold..."
          coverage report --fail-under=30 || echo "⚠️ Coverage below 30%"

  # =============================================================================
  # BUILD & PUSH DOCKER IMAGES TO GHCR
  # =============================================================================
  build:
    needs: [lint-and-security, frontend-checks, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    # We need explicit permissions for pushing to GHCR
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: builder
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            BUILD_DATE=${{ github.sha }}
          no-cache: true

  # =============================================================================
  # DEPLOY TO PRODUCTION
  # =============================================================================
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
          log-public-key: false

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          echo "🚀 Starting deployment to EC2..."
          
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            set -e
            
            echo '📂 Navigating to project directory...'
            cd /home/ubuntu/aniShows
            
            echo '🔄 Pulling latest compose files from GitHub...'
            # Note: We pull the compose files and scripts, but not the heavy dependencies
            git stash || true
            git pull origin main
            
            echo '🔑 Logging into GitHub Container Registry...'
            echo '${GHCR_PAT}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo '🐳 Running fast deployment script...'
            ./deploy-prod.sh
            
            echo '✅ Deployment completed successfully!'
          "

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
          exit 1

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Successfully deployed commit ${{ github.sha }} to production"
