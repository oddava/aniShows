name: CI/CD Pipeline

# PRs and develop are covered by ci.yml; this workflow only builds and deploys
# main, and only after the same CI checks pass.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anishows-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anishows-frontend

jobs:
  # =============================================================================
  # LINT & TEST (must pass before anything is built or deployed)
  # =============================================================================
  ci:
    uses: ./.github/workflows/ci.yml

  # =============================================================================
  # BUILD & PUSH DOCKER IMAGES TO GHCR
  # =============================================================================
  build:
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    # We need explicit permissions for pushing to GHCR
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The production stack must parse in every mode before anything ships
      # (env_file .env is required by the services, so an empty one stands in).
      - name: Lint production compose files
        run: |
          set -euo pipefail
          : > .env
          for profiles in "" bundled-db analytics tunnel "bundled-db,analytics,tunnel"; do
            COMPOSE_PROFILES="$profiles" docker compose -f docker-compose.prod.yml config -q
            COMPOSE_PROFILES="$profiles" docker compose -f docker-compose.prod.yml -f infra/compose/public-ports.yml config -q
          done
          docker compose -f docker-compose.prod.yml -f infra/compose/loopback-port.yml config -q
          docker compose -f docker-compose.prod.yml -f infra/compose/shared-tunnel-network.yml config -q
          bash -n deploy-prod.sh backups/entrypoint.sh backups/shell/*.sh scripts/deploy/*.sh
          rm .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Sentry release, readiness cache key and image revision label.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: builder
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_UMAMI_SCRIPT_URL=${{ secrets.VITE_UMAMI_SCRIPT_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENVIRONMENT=production
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            BUILD_DATE=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify frontend image contents
        run: |
          echo "🔍 Verifying frontend image contents..."
          echo "📋 Listing /app/dist/ in the pushed image:"
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest ls -la /app/dist/
          echo ""
          echo "📋 Listing /app/dist/assets/:"
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest ls -la /app/dist/assets/ | head -30
          echo ""
          echo "📋 index.html hash:"
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest md5sum /app/dist/index.html
          echo ""
          echo "📋 index.html content (first 20 lines):"
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest head -20 /app/dist/index.html
          
          echo ""
          echo "✅ Verifying critical files exist..."
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest test -f /app/dist/index.html || (echo "❌ index.html missing!" && exit 1)
          docker run --rm ${{ env.FRONTEND_IMAGE }}:latest test -d /app/dist/assets || (echo "❌ assets directory missing!" && exit 1)
          echo "✅ All critical files verified!"

  # =============================================================================
  # DEPLOY TO PRODUCTION
  # =============================================================================
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PASSPHRASE: ${{ secrets.EC2_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_file=~/.ssh/ec2_deploy_key
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          # GitHub runners are non-interactive; use askpass when passphrase is provided.
          if [ -n "${EC2_SSH_PASSPHRASE:-}" ]; then
            askpass=~/.ssh/ssh-askpass.sh
            printf '%s\n' '#!/usr/bin/env bash' 'echo "$EC2_SSH_PASSPHRASE"' > "$askpass"
            chmod 700 "$askpass"
            export SSH_ASKPASS="$askpass"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid -w ssh-add "$key_file" < /dev/null
            rm -f "$askpass"
          else
            if ! ssh-add "$key_file" < /dev/null; then
              echo "Failed to add EC2_SSH_KEY. If the key is passphrase protected, set EC2_SSH_PASSPHRASE."
              exit 1
            fi
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Add the host key to known_hosts for secure verification
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "SSH configured with host key verification"

      - name: Deploy to EC2
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          echo "🚀 Starting deployment to EC2..."
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            set -e
            
            echo '📂 Navigating to project directory...'
            APP_DIR=''
            for dir in /root/aniShows /home/root/aniShows /home/ubuntu/aniShows; do
              if [ -d \"\$dir\" ]; then
                APP_DIR=\"\$dir\"
                break
              fi
            done
            if [ -z \"\$APP_DIR\" ]; then
              echo 'Could not find aniShows directory on server.'
              exit 1
            fi
            echo \"Using app directory: \$APP_DIR\"
            cd \"\$APP_DIR\"
            
            echo '🔄 Pulling latest compose files from GitHub...'
            git stash push --include-untracked -m \"pre-deploy-${SHORT_SHA}\" || true
            git fetch origin main
            if [ -e .codex ] && ! git ls-files --error-unmatch .codex >/dev/null 2>&1; then
              echo '🧹 Removing local untracked .codex placeholder before updating...'
              rm -rf .codex
            fi
            git pull --ff-only origin main
            
            echo '🔑 Logging into GitHub Container Registry...'
            echo '${GHCR_PAT}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo '====================================='
            echo '🎯 DEPLOYING commit ${SHORT_SHA}'
            echo '====================================='

            # deploy-prod.sh does everything: refusals, migration plan and
            # pre-migrate backup, migrate, rolling web, the frontend files (after
            # the backend, copied over the old build), Caddy/cloudflared, and the
            # smoke tests (through Caddy and PUBLIC_BASE_URL). No localhost:80
            # check here: tunnel mode publishes no host port.
            BACKEND_TAG=sha-${SHORT_SHA} FRONTEND_TAG=sha-${SHORT_SHA} bash ./deploy-prod.sh

            echo '📊 Checking container status...'
            bash scripts/deploy/compose.sh ps

            echo '✅ Deployment completed successfully!'
          "

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
          exit 1

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Successfully deployed commit ${{ github.sha }} to production"
