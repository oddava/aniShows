name: Deploy (Hetzner VPS)

# Manual only: Actions → "Deploy (Hetzner VPS)" → Run workflow, on the branch
# or tag to ship (usually main). Nothing deploys on push.
#
#   1. CI (ci.yml) on that commit
#   2. backend and frontend images built and pushed to GHCR as sha-<7 chars>
#   3. over SSH on the VPS (scripts/deploy/remote_deploy.sh): check out that
#      commit in VPS_APP_DIR and run ./deploy-prod.sh, which pulls the images,
#      backs the database up before any migration, migrates, rolls web, copies
#      the frontend, reloads Caddy and runs its smoke tests
#   4. the public health endpoint, checked from outside
#
# Rollback / redeploy: set "rollback_to" to an earlier deployed commit; CI and
# the build are skipped and that commit's images (already in GHCR) go live.
# deploy-prod.sh also prints a local rollback recipe when a deploy fails.
#
# Secrets (Settings → Secrets and variables → Actions, environment "production"):
#   VPS_HOST             server hostname or IP
#   VPS_USER             SSH user (in the docker group; owns VPS_APP_DIR)
#   VPS_SSH_KEY          private key for that user (a dedicated deploy key)
#   VPS_SSH_KNOWN_HOSTS  the server's host key line(s): ssh-keyscan -p <port> <host>
#   VPS_APP_DIR          the checkout on the server, e.g. /srv/anishows
#   VPS_SSH_PORT         optional, default 22
#   VITE_GOOGLE_CLIENT_ID, VITE_SENTRY_DSN, VITE_UMAMI_SCRIPT_URL,
#   VITE_UMAMI_WEBSITE_ID  optional, baked into the frontend build (the build
#                        job also runs in "production" so it can read them)
# docs/deploy/DEPLOY.md ("Deploying from GitHub Actions") has the setup.

on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Redeploy an earlier commit instead (its SHA; skips CI and the build)"
        required: false
        default: ""
      health_url:
        description: "Public liveness URL checked after the deploy"
        required: true
        default: "https://anishows.com/api/v1/health/"

# One deploy at a time, never cancelled halfway (deploy-prod.sh also holds a
# lock on the server).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Must match docker-compose.prod.yml and deploy-prod.sh.
  BACKEND_IMAGE: ghcr.io/oddava/anishows-backend
  FRONTEND_IMAGE: ghcr.io/oddava/anishows-frontend

jobs:
  # ===========================================================================
  # Which commit goes out
  # ===========================================================================
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the commit
        id: pick
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$ROLLBACK_TO" ]; then
            if ! [[ "$ROLLBACK_TO" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::rollback_to must be a commit SHA (7-40 hex characters)"
              exit 1
            fi
            echo "commit=$ROLLBACK_TO" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Rollback/redeploy of $ROLLBACK_TO (CI and build skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Deploying ${GITHUB_REF_NAME} at $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # Lint and test (must pass before anything is built or deployed)
  # ===========================================================================
  ci:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  # ===========================================================================
  # Build and push the images (sha-<7 chars>, the tags deploy-prod.sh pulls)
  # ===========================================================================
  build:
    name: Build and push images
    needs: [resolve, ci]
    if: needs.resolve.outputs.build == 'true'
    # The VPS is ARM64 (Hetzner Cax): build natively on an ARM runner so the
    # images match it and the "Verify the frontend image" docker run works.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # The VITE_* build values are environment secrets: only a job that names
    # the environment can read them (without it the frontend builds with empty
    # values, silently: no Google sign-in). A required-reviewer rule on
    # "production" therefore asks twice per run (build, then deploy).
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The production stack must parse in every mode before anything ships
      # (env_file .env is required by the services, so a stub stands in).
      # TRUSTED_PROXY_CIDRS has no default (compose refuses the file without
      # it), so the stub sets the template's value; the refusal itself is
      # checked last. Object storage is the host's RustFS over the external
      # network S3_NETWORK (Compose does not need it to exist to parse), so
      # the stack must not name a bundled MinIO or its bucket job again.
      - name: Lint production compose files and deploy scripts
        run: |
          set -euo pipefail
          {
            echo "TRUSTED_PROXY_CIDRS=10.250.250.0/25"
            echo "PROXY_NETWORK=proxy"
            echo "TUNNEL_NETWORK=cloudflared"
            echo "S3_NETWORK=anishows-s3"
          } > .env
          for profiles in "" bundled-db analytics tunnel "bundled-db,analytics,tunnel"; do
            COMPOSE_PROFILES="$profiles" docker compose -f docker-compose.prod.yml config -q
            COMPOSE_PROFILES="$profiles" docker compose -f docker-compose.prod.yml -f infra/compose/proxy-port.yml config -q
            COMPOSE_PROFILES="$profiles" docker compose -f docker-compose.prod.yml -f infra/compose/public-ports.yml config -q
          done
          docker compose -f docker-compose.prod.yml -f infra/compose/shared-proxy-network.yml config -q
          docker compose -f docker-compose.prod.yml -f infra/compose/loopback-port.yml config -q
          docker compose -f docker-compose.prod.yml -f infra/compose/shared-tunnel-network.yml config -q
          if grep -n -i -e minio -e createbuckets docker-compose.prod.yml Caddyfile.prod deploy-prod.sh infra/compose/*.yml; then
            echo "::error::the production stack must not reference minio or createbuckets (media is the host's RustFS)" >&2
            exit 1
          fi
          : > .env
          if docker compose -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "docker-compose.prod.yml must refuse an unset TRUSTED_PROXY_CIDRS" >&2
            exit 1
          fi
          # bash -n checks one file per call (further names are its arguments).
          for script in deploy-prod.sh backups/entrypoint.sh backups/shell/*.sh scripts/deploy/*.sh; do
            bash -n "$script"
          done
          # The docs and the rollback recipe run the scripts directly (./deploy-prod.sh,
          # scripts/deploy/compose.sh): every tracked script keeps its exec bit.
          not_executable="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$not_executable" ]; then
            echo "::error::scripts committed without the exec bit (git update-index --chmod=+x):" >&2
            echo "$not_executable" >&2
            exit 1
          fi
          rm .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Sentry release, readiness cache key and image revision label.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: builder
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_UMAMI_SCRIPT_URL=${{ secrets.VITE_UMAMI_SCRIPT_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENVIRONMENT=production
            BUILD_DATE=${{ github.sha }}
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

      # The VPS pulls linux/arm64; fail here rather than at the image pull.
      - name: Verify the pushed images include linux/arm64
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            ref="${image}:sha-${GITHUB_SHA::7}"
            if ! docker buildx imagetools inspect "$ref" | grep -q 'Platform:[[:space:]]*linux/arm64'; then
              echo "::error::$ref has no linux/arm64 manifest"
              exit 1
            fi
            echo "$ref includes linux/arm64"
          done

      - name: Verify the frontend image holds the build
        run: |
          set -euo pipefail
          image="${FRONTEND_IMAGE}:sha-${GITHUB_SHA::7}"
          docker run --rm "$image" test -f /app/dist/index.html
          docker run --rm "$image" test -d /app/dist/assets
          echo "Frontend image $image has index.html and assets/"

  # ===========================================================================
  # Deploy to the VPS over SSH
  # ===========================================================================
  deploy:
    name: Deploy to the VPS
    needs: [resolve, build]
    # A rollback skips ci/build; a normal run needs the build to have passed.
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.resolve.outputs.build == 'false' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The remote script that goes over SSH comes from the commit that
          # triggered the run (it is the same for a rollback).
          sparse-checkout: scripts/deploy/remote_deploy.sh
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          missing=()
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_APP_DIR; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (docs/deploy/DEPLOY.md, Deploying from GitHub Actions)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, never trust-on-first-use.
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port ${VPS_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 6"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh vps true
          echo "SSH to the VPS works"

      - name: Deploy
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          # printf %q: the directory reaches the remote shell as one word.
          ssh vps "bash -s -- $(printf '%q' "$VPS_APP_DIR") $(printf '%q' "$COMMIT")" \
            < scripts/deploy/remote_deploy.sh

      - name: Public health check
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)"
            if [ "$code" = 200 ] && grep -q '"status"' /tmp/health.json; then
              echo "Healthy: $HEALTH_URL"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt: HTTP ${code:-none}"
            sleep $((attempt * 5))
          done
          echo "::error::$HEALTH_URL is not healthy after the deploy"
          exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
