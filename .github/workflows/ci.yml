name: CI

# Runs on every PR and on pushes to develop. Pushes to main run it through
# deploy.yml (workflow_call), which only builds and deploys if it passes.
on:
  pull_request:
  push:
    branches: [ develop ]
  workflow_call:
  workflow_dispatch:

concurrency:
  # The "ci-" prefix keeps this group distinct from deploy.yml's group when
  # called from it (github.workflow is the caller's name in that case).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anishows_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anishows_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: root.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: anishows_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      USE_S3: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: uv run pytest -p no:cacheprovider

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      - name: Build
        run: npm run build
