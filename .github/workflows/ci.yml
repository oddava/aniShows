name: CI

# Runs on every PR and on pushes to develop. Main only takes PRs that pass the
# two required checks, "Backend (ruff + pytest)" and "Frontend (eslint +
# vitest + build)", so the deploy (deploy.yml) does not run it again.
#
# For speed the suites run as parallel shards (PYTEST_SHARD in conftest.py,
# vitest --shard), beside a lint job each; the two required checks are small
# jobs that pass only when every part of their side passed.
on:
  pull_request:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint (ruff + migrations + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: root.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      USE_S3: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Mypy (no more errors than the recorded ceiling)
        run: uv run python scripts/check_mypy_ceiling.py

  backend-tests:
    name: Backend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anishows_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anishows_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DJANGO_SETTINGS_MODULE: root.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: anishows_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      USE_S3: "False"
      PYTEST_SHARD: ${{ matrix.shard }}/3

    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        # Runner images ship it (the file package); install only if one ever stops.
        run: dpkg -s libmagic1 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1; }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Pytest
        run: uv run pytest -p no:cacheprovider -n auto -q

  backend:
    name: Backend (ruff + pytest)
    needs: [backend-lint, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every backend job passed
        run: |
          test "${{ needs.backend-lint.result }}" = success
          test "${{ needs.backend-tests.result }}" = success

  frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm run test:run -- --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend (eslint + vitest + build)
    needs: [frontend-build, frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every frontend job passed
        run: |
          test "${{ needs.frontend-build.result }}" = success
          test "${{ needs.frontend-tests.result }}" = success
