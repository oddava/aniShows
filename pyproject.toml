[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "root*"]
exclude = ["frontend*", "backups*", "monitoring*", "tests*"]

[project]
name = "anishows"
version = "0.1.0"
description = "Anime tracking and discovery platform"
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.2.0",
    "cookiecutter>=2.6.0",
    "cryptography>=46.0.3",
    "defusedxml>=0.7.1",
    "dj-database-url>=3.0.1",
    "django>=5.2.7",
    "django-allauth>=65.13.1",
    "django-debug-toolbar>=6.1.0",
    "django-filter>=25.2",
    "django-jazzmin>=3.0.1",
    "django-redis>=6.0.0",
    "django-tailwind>=4.2.0",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "pip>=25.3",
    "prometheus-client>=0.19.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-magic>=0.4.27",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "dj-rest-auth>=6.0.0",
    "django-cors-headers>=4.3.0",
    "gunicorn>=23.0.0",
    "uvicorn>=0.38.0",
    "whitenoise>=6.11.0",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "django-celery-beat>=2.5.0",
    "django-celery-results>=2.5.1",
    "django-storages[s3]>=1.14.2",
    "boto3>=1.34.0",
    "django-imagekit>=5.0.0",
    "pillow-avif-plugin>=1.4.0",
    "pywebpush>=2.0.0",
    "channels[daphne]>=4.2.0",
    "channels-redis>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "python-whois>=0.9.0",
    "idna>=3.6",
    "google-api-python-client>=2.100.0",
    "pydantic>=2.5.0",
    "drf-spectacular>=0.29.0",
    "sentry-sdk[django,celery]>=2.19.0",
    "zstandard>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "django-stubs>=5.1.0",
    "djangorestframework-stubs>=3.15.0",
    "pre-commit>=3.8.0",
    "bandit>=1.7.10",
    "safety>=3.2.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
]

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific rules
    "DJ",  # flake8-django
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
]

ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D106",  # Missing docstring in public nested class
    "D205",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the first line
    "D415",  # First line should end with a period, question mark, or exclamation point
    "S101",  # Use of assert detected (allowed in tests)
    "S105",  # Possible hardcoded password (too many false positives)
    "S106",  # Possible hardcoded password (too many false positives)
    "S107",  # Possible hardcoded password (too many false positives)
    "RUF012", # Mutable default values - common in Django, can be fixed later
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "F401",  # Unused imports
    "F811",  # Redefinition of unused
    "N806",  # Variable in function should be lowercase
    "PTH122", # os.path.splitext() should be replaced
    "PTH123", # open() should be replaced by Path.open()
    "B904",   # Within an except clause, raise exceptions with 'from err'
    "SIM102", # Use a single if statement instead of nested if statements
    "SIM103", # Return the condition directly
    "RUF010", # Use explicit conversion flag
    "DJ001",  # Avoid using null=True on string-based fields
    "DJ008",  # Model does not define __str__ method
    "UP035",  # typing.List is deprecated
    "UP006",  # Use list instead of List for type annotation
    "S311",   # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S110",   # try-except-pass detected
    "F823",   # Local variable referenced before assignment
    "D417",   # Missing argument description in docstring
    "B023",   # Function definition does not bind loop variable
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["apps", "root"]

[tool.ruff.lint.per-file-ignores]
"root/settings/*.py" = ["F403", "F405"]
"root/settings/__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "root.settings.development"

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "root.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
testpaths = ["apps"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "*/apps.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 30

# =============================================================================
# BANDIT CONFIGURATION (Security)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B105", "B106", "B107"]
