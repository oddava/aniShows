<!-- Notification Container -->
<div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm w-full pointer-events-none">
</div>

<style>
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(400px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    @keyframes iconPop {
        0% {
            transform: scale(0);
            opacity: 0;
        }
        50% {
            transform: scale(1.2);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .notification {
        animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: auto;
        transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .notification:hover {
        transform: translateX(-4px);
    }

    .notification-icon {
        animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }

    .notification-close {
        transition: all 0.2s ease;
    }

    .notification-close:hover {
        transform: rotate(90deg);
    }
</style>

<script>
    function showNotification(type, message, duration = 5000) {
        const container = document.getElementById('notification-container');
        const id = Date.now();

        const styles = {
            success: {
                border: 'border-emerald-500/20',
                icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                iconColor: 'text-emerald-500',
                bg: 'bg-emerald-500/5'
            },
            error: {
                border: 'border-rose-500/20',
                icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                iconColor: 'text-rose-500',
                bg: 'bg-rose-500/5'
            },
            warning: {
                border: 'border-amber-500/20',
                icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>',
                iconColor: 'text-amber-500',
                bg: 'bg-amber-500/5'
            },
            info: {
                border: 'border-blue-500/20',
                icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                iconColor: 'text-blue-500',
                bg: 'bg-blue-500/5'
            }
        };

        const style = styles[type] || styles.info;

        const notification = document.createElement('div');
        notification.id = `notification-${id}`;
        notification.className = `notification ${style.bg} ${style.border} backdrop-blur-xl border rounded-lg shadow-lg overflow-hidden`;
        notification.innerHTML = `
            <div class="relative p-3.5 pr-10">
                <div class="flex items-center space-x-3">
                    <div class="notification-icon ${style.iconColor} flex-shrink-0">
                        ${style.icon}
                    </div>
                    <p class="text-sm text-white/90 font-medium leading-snug">
                        ${message}
                    </p>
                </div>

                <button
                    onclick="removeNotification('${id}')"
                    class="notification-close absolute top-3 right-3 text-white/40 hover:text-white/80"
                    aria-label="Close notification"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        `;

        container.appendChild(notification);

        setTimeout(() => {
            removeNotification(id);
        }, duration);
    }

    function removeNotification(id) {
        const notification = document.getElementById(`notification-${id}`);
        if (notification) {
            notification.style.opacity = '0';
            notification.style.transform = 'translateX(400px) scale(0.95)';
            setTimeout(() => {
                notification.remove();
            }, 300);
        }
    }

    // Auto-show Django messages on page load
    document.addEventListener('DOMContentLoaded', function() {
        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message.tags }}', '{{ message|escapejs }}');
            {% endfor %}
        {% endif %}
    });
</script>
