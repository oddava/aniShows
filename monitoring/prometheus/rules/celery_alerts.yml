groups:
  - name: celery_alerts
    rules:
      # High task failure rate
      - alert: CeleryHighFailureRate
        expr: |
          (
            sum(rate(celery_task_executions_total{status="failure"}[5m]))
            /
            sum(rate(celery_task_executions_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate"
          description: "Celery task failure rate is above 10% for the last 5 minutes"

      # Deep queue backlog
      - alert: CeleryQueueBacklog
        expr: celery_queue_size > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog detected"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} pending tasks"

      # No task executions (possible worker outage)
      - alert: CeleryNoTaskExecutions
        expr: sum(rate(celery_task_executions_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No Celery task executions"
          description: "No tasks have been executed in the last 10 minutes"

      # High API error rate
      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(external_api_calls_total{status="failure"}[5m]))
            /
            sum(rate(external_api_calls_total[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "External API error rate is above 20% for the last 5 minutes"

      # Slow API response time
      - alert: APISlowResponse
        expr: |
          histogram_quantile(0.95,
            sum(rate(external_api_call_duration_seconds_bucket[5m])) by (le, service)
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time for {{ $labels.service }} is above 5 seconds"

      # Circuit breaker open
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1  # 1 = OPEN
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is OPEN"
          description: "Circuit breaker {{ $labels.name }} is open - service unavailable"
