global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'anishows'

# Alertmanager configuration (optional - for now just dashboard alerts)
alerting:
  alertmanagers: []

# Load alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # Django Web Application
  - job_name: 'django'
    static_configs:
      - targets: ['web:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    # Basic auth for metrics endpoint
    basic_auth:
      username: '${METRICS_USERNAME:-admin}'
      password: '${METRICS_PASSWORD:-admin}'

  # Celery Workers
  - job_name: 'celery'
    static_configs:
      - targets: 
        - 'celery:9090'
        - 'celery_priority:9090'
        - 'celery_images:9090'
        - 'celery_analytics:9090'
    metrics_path: '/'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis (using redis_exporter if added later)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']

  # PostgreSQL (using postgres_exporter if added later)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['db:5432']
