services:
  web:
    build:
      context: .
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: anishows_web:latest
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    command: gunicorn root.wsgi:application -c gunicorn.conf.py
    environment:
      DEBUG: "${DEBUG:-False}"
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      USE_S3: "${USE_S3:-True}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://minio:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
      AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-us-east-1}"
      MINIO_PUBLIC_DOMAIN: "${MINIO_PUBLIC_DOMAIN:-localhost:9000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-web,localhost,127.0.0.1,0.0.0.0}"
      DJANGO_SETTINGS_MODULE: "root.settings"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      # Prometheus multi-process metrics
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
    volumes:
      - prometheus_multiproc:/tmp/prometheus
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # React Frontend
  frontend:
    build:
      context: ./frontend
      target: development
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis with persistence enabled
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword123}
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Celery Worker - Optimized for small EC2 (reduced concurrency)
  celery:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "critical,high_priority,default,batch,images,notifications,analytics,low_priority", "--concurrency=1", "--pool=solo", "--max-tasks-per-child=1000" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      DJANGO_SETTINGS_MODULE: "root.settings"
      # Prometheus multi-process metrics
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
    volumes:
      - prometheus_multiproc:/tmp/prometheus
    user: "0:0"
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Celery Beat - Reuses web image
  beat:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "beat", "--loglevel=info" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      DJANGO_SETTINGS_MODULE: "root.settings"
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO - Local S3 Compatible Storage
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # MinIO Bucket Initialization - creates bucket on first run
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb myminio/$${BUCKET_NAME} --ignore-existing;
      mc anonymous set download myminio/$${BUCKET_NAME}/media;
      exit 0;
      "

  # Backup Service
  backup:
    build:
      context: ./backups
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: anishows-backup
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "${DB_HOST:-db}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
    depends_on:
      - db
      - minio
    volumes:
      - ./backups-data:/backups
      - minio_data:/minio_data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Caddy Reverse Proxy & SSL
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Grafana local development
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./CACHE:/app/CACHE:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend
      - grafana
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    restart: always
    ports:
      - "9090:9090"
    env_file:
      - .env
    volumes:
      - ./monitoring/prometheus/entrypoint.sh:/entrypoint.sh:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:10.2.3
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Admin Configuration
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      # User Registration
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # Anonymous Access
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Server Configuration
      - GF_SERVER_ROOT_URL=http://localhost:8080
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # Session & Security
      - GF_SESSION_PROVIDER=file
      - GF_SESSION_PROVIDER_CONFIG=sessions
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS=31536000
      # Logging
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_SECURITY_AUDIT_LOGGING=true
      # Snapshots
      - GF_SNAPSHOTS_ENABLED=false
      # Explore
      - GF_EXPLORE_ENABLED=true
      # News Feed
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  db_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  prometheus_multiproc:  # Shared volume for multi-process metrics
