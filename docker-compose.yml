services:
  web:
    build:
      context: .
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: anishows_web:latest
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      uv run gunicorn root.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --worker-class gthread
      --threads 4
      --worker-connections 1000
      --max-requests 10000
      --max-requests-jitter 100
      --timeout 60
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level warning
      --preload
    environment:
      DEBUG: "${DEBUG:-False}"
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      USE_S3: "${USE_S3:-True}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://minio:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
      AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-us-east-1}"
      MINIO_PUBLIC_DOMAIN: "${MINIO_PUBLIC_DOMAIN:-localhost:9000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-web,localhost,127.0.0.1,0.0.0.0}"
      DJANGO_SETTINGS_MODULE: "root.settings"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
    volumes:
      - .:/app
      - /app/.venv
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # React Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    depends_on:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis with persistence enabled
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword123}
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Celery Worker - Optimized for small EC2 (reduced concurrency)
  celery:
    image: anishows_web:latest
    command: [ "uv", "run", "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,low_priority", "--concurrency=1", "--pool=solo", "--max-tasks-per-child=1000" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      DJANGO_SETTINGS_MODULE: "root.settings"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Celery Beat - Reuses web image
  beat:
    image: anishows_web:latest
    command: [ "uv", "run", "celery", "-A", "root", "beat", "--loglevel=info" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      DJANGO_SETTINGS_MODULE: "root.settings"
    depends_on:
      - web
      - redis
    volumes:
      - .:/app
      - /app/.venv
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO - Local S3 Compatible Storage
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Backup Service
  backup:
    build:
      context: ./backups
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: anishows-backup
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "${DB_HOST:-db}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
    depends_on:
      - db
      - minio
    volumes:
      - ./backups-data:/backups
      - minio_data:/minio_data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Caddy Reverse Proxy & SSL
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./CACHE:/app/CACHE:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  db_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
