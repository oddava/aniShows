services:
  web:
    build:
      context: .
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: anishows_web:latest
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    command: gunicorn root.asgi:application -c gunicorn.conf.py
    environment:
      DEBUG: "${DEBUG:-False}"
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      USE_S3: "${USE_S3:-True}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://minio:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
      AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-us-east-1}"
      MINIO_PUBLIC_DOMAIN: "${MINIO_PUBLIC_DOMAIN:-localhost:9000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-web,localhost,127.0.0.1,0.0.0.0}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      # Multiprocess metrics
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      # Sentry
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # Daphne ASGI Server - WebSocket connections
  daphne:
    image: anishows_web:latest
    command: [ "daphne", "-b", "0.0.0.0", "-p", "8001", "root.asgi:application" ]
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      USE_S3: "${USE_S3:-True}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://minio:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
      AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-us-east-1}"
      MINIO_PUBLIC_DOMAIN: "${MINIO_PUBLIC_DOMAIN:-localhost:9000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-web,daphne,localhost,127.0.0.1,0.0.0.0}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    # Disable the Dockerfile HEALTHCHECK (it targets port 8000 / Gunicorn)
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # React Frontend
  frontend:
    build:
      context: ./frontend
      target: development
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_UMAMI_SCRIPT_URL=${VITE_UMAMI_SCRIPT_URL:-}
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-development}
        - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # PostgreSQL Database
  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anishows_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Umami PostgreSQL Database
  umami_db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${UMAMI_DB_USER:-umami}"
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD:-umami}"
      POSTGRES_DB: "${UMAMI_DB_NAME:-umami}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Umami Analytics
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami_db:5432/${UMAMI_DB_NAME:-umami}"
      DATABASE_TYPE: "postgresql"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379/0"
      APP_SECRET: "${UMAMI_APP_SECRET:-change-me}"
    depends_on:
      umami_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PgBouncer - PostgreSQL connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    expose:
      - "6432"
    environment:
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-1}"
      DB_HOST: "${PGBOUNCER_DB_HOST:-db}"
      DB_NAME: "${DB_NAME:-anishows_db}"
      LISTEN_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      POOL_MODE: "${PGBOUNCER_POOL_MODE:-transaction}"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1000}"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-50}"
      RESERVE_POOL_SIZE: "${PGBOUNCER_RESERVE_POOL_SIZE:-20}"
      RESERVE_POOL_TIMEOUT: "${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}"
      AUTH_TYPE: "${PGBOUNCER_AUTH_TYPE:-scram-sha-256}"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "${DB_PGBOUNCER_PORT:-6432}", "-U", "${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Redis with persistence enabled
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword123} --maxmemory 192mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Celery Worker - default/batch/background queues
  celery:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "default,batch,low_priority", "--concurrency=${CELERY_DEFAULT_CONCURRENCY:-1}", "--pool=prefork", "--max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}", "--max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-384000}", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      # Multiprocess metrics
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      # Sentry
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    healthcheck:
      disable: true
    user: "1000:1000"
    depends_on:
      web:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Celery Worker - user-facing and notification queues
  celery_priority:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "critical,high_priority,notifications", "--concurrency=${CELERY_PRIORITY_CONCURRENCY:-1}", "--pool=prefork", "--max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}", "--max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-384000}", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    healthcheck:
      disable: true
    user: "1000:1000"
    depends_on:
      web:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  # Celery Worker - image processing queue
  celery_images:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "images", "--concurrency=${CELERY_IMAGES_CONCURRENCY:-1}", "--pool=prefork", "--max-tasks-per-child=${CELERY_IMAGES_MAX_TASKS_PER_CHILD:-100}", "--max-memory-per-child=${CELERY_IMAGES_MAX_MEMORY_PER_CHILD_KB:-512000}", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    healthcheck:
      disable: true
    user: "1000:1000"
    depends_on:
      web:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  # Celery Worker - analytics queue
  celery_analytics:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "worker", "-l", "WARNING", "-Q", "analytics", "--concurrency=${CELERY_ANALYTICS_CONCURRENCY:-1}", "--pool=prefork", "--max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}", "--max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-384000}", "-O", "fair" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    healthcheck:
      disable: true
    user: "1000:1000"
    depends_on:
      web:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  # Celery Beat - Reuses web image
  beat:
    image: anishows_web:latest
    command: [ "celery", "-A", "root", "beat", "--loglevel=info" ]
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST:-pgbouncer}"
      DB_PORT: "${DB_PORT:-6432}"
      DB_USE_PGBOUNCER: "${DB_USE_PGBOUNCER:-True}"
      DB_PGBOUNCER_HOST: "${DB_PGBOUNCER_HOST:-pgbouncer}"
      DB_PGBOUNCER_PORT: "${DB_PGBOUNCER_PORT:-6432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword123}"
      REDIS_DB: "${REDIS_DB:-0}"

      # Sentry
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    healthcheck:
      disable: true
    depends_on:
      - web
      - pgbouncer
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO - Local S3 Compatible Storage
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # MinIO Bucket Initialization - creates bucket on first run
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      MINIO_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-anishows-media}"
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD}; mc mb myminio/$${BUCKET_NAME} --ignore-existing; mc anonymous set download myminio/$${BUCKET_NAME}/media; exit 0; "

  # Backup Service
  backup:
    build:
      context: ./backups
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: anishows-backup
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "${PGBOUNCER_DB_HOST:-db}"
      POSTGRES_DB: "${DB_NAME:-anishows_db}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-1}"
    depends_on:
      - db
      - minio
    volumes:
      - ./backups-data:/backups
      - minio_data:/minio_data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Caddy Reverse Proxy & SSL
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./CACHE:/app/CACHE:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - daphne
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  db_data:
  umami_db_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
