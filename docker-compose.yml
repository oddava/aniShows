# Local development stack.
#
#   make up   -> web, celery, beat, frontend, db, redis, minio
#   open http://localhost:5173  (Vite proxies /api, /ws, /media, /django-admin)
#
# Python and frontend sources are bind-mounted, so code changes reload without
# rebuilding. Optional extras live behind profiles:
#   docker compose --profile analytics up -d   # Umami
#   docker compose --profile proxy up -d       # Caddy on :80 (prod-like routing)
#   docker compose --profile backup up -d      # scheduled backups
#   docker compose --profile jikan up -d       # self-hosted Jikan (scrapes MAL directly);
#                                              # use when api.jikan.moe is unreachable and
#                                              # set JIKAN_BASE_URL=http://jikan:8080/v4 in .env

x-backend: &backend
  image: anishows_web:dev
  build:
    context: .
    target: development
  env_file: .env
  environment:
    DJANGO_ENV: development
    DB_HOST: db
    DB_PORT: "5432"
    DB_USE_PGBOUNCER: "False"
    DB_CONN_MAX_AGE: "0"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    AWS_S3_ENDPOINT_URL: http://minio:9000
    MINIO_PUBLIC_DOMAIN: localhost:${FRONTEND_PORT:-5173}
    JIKAN_BASE_URL: ${JIKAN_BASE_URL:-https://api.jikan.moe/v4}
  volumes:
    - .:/app
  user: "1000:1000"
  depends_on: &backend-deps
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    createbuckets:
      condition: service_completed_successfully

services:
  web:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec uvicorn root.asgi:application --host 0.0.0.0 --port 8000
        --reload --reload-dir apps --reload-dir root --reload-dir templates
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  celery:
    <<: *backend
    command: >
      celery -A root worker -l INFO --concurrency=2
      -Q critical,high_priority,default,notifications,batch,images,analytics,low_priority
    healthcheck:
      disable: true
    depends_on:
      <<: *backend-deps
      web:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A root beat -l INFO --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      <<: *backend-deps
      web:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_ENVIRONMENT: development
      VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-anishows_db}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anishows_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-anishows-media}
    entrypoint: >
      /bin/sh -c "set -e;
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb --ignore-existing local/$${BUCKET_NAME};
      mc anonymous set download local/$${BUCKET_NAME}/media"

  # -------------------------------------------------------------------- tests

  # `make test` (docker compose --profile test run --rm test). Uses its own
  # throwaway Postgres and no memory cap, independent of the dev services.
  test_db:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anishows_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anishows_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    profiles: [test]
    image: anishows_web:dev
    build:
      context: .
      target: development
    working_dir: /app
    command: ["python", "-m", "pytest"]
    volumes:
      - .:/app
      # Hide the dev .env (settings load it) so local runs match CI.
      - /dev/null:/app/.env:ro
    environment:
      DJANGO_SETTINGS_MODULE: root.settings.test
      DJANGO_SECRET_KEY: test-secret-key
      TEST_DB_HOST: test_db
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: anishows_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      USE_S3: "False"
    user: "1000:1000"
    depends_on:
      test_db:
        condition: service_healthy

  # ------------------------------------------------------------------ optional

  caddy:
    profiles: [proxy]
    image: caddy:alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    ports:
      - "80:80"
    environment:
      DOMAIN_NAME: http://localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - frontend

  umami_db:
    profiles: [analytics]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami_db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    depends_on:
      umami_db:
        condition: service_healthy

  jikan:
    profiles: [jikan]
    image: jikanme/jikan-rest:latest@sha256:505f06101617c337db5b301701258de63a55f6593b0181cf2d84c92ff49cee9d
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://jikan:8080
      DB_CACHING: "true"
      DB_CONNECTION: mongodb
      DB_HOST: jikan_mongodb
      DB_PORT: "27017"
      DB_DATABASE: jikan
      DB_ADMIN: jikan
      CACHING: "true"
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      QUEUE_CONNECTION: sync
      SCOUT_DRIVER: typesense
      SCOUT_QUEUE: "false"
      TYPESENSE_HOST: jikan_typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${JIKAN_TYPESENSE_API_KEY:-jikan-typesense-key}
      SOURCE: local
      MAX_RESULTS_PER_PAGE: "25"
    expose:
      - "8080"
    depends_on:
      jikan_mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      jikan_typesense:
        condition: service_started

  jikan_mongodb:
    profiles: [jikan]
    image: mongo:7
    command: ["--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - jikan_mongodb_data:/data/db

  jikan_typesense:
    profiles: [jikan]
    image: typesense/typesense:0.25.2
    command: ["--data-dir", "/data", "--api-key=${JIKAN_TYPESENSE_API_KEY:-jikan-typesense-key}"]
    volumes:
      - jikan_typesense_data:/data

  backup:
    profiles: [backup]
    build: ./backups
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-anishows_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - db
      - minio
    volumes:
      - ./backups-data:/backups
      - minio_data:/minio_data

volumes:
  db_data:
  redis_data:
  minio_data:
  umami_db_data:
  jikan_mongodb_data:
  jikan_typesense_data:
