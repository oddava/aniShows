# Local development stack.
#
#   make up   -> web, celery, beat, frontend, db, redis, rustfs
#   open http://localhost:5173  (Vite proxies /api, /ws, /media, /django-admin)
#
# Python and frontend sources are bind-mounted, so code changes reload without
# rebuilding. Optional extras live behind profiles:
#   docker compose --profile analytics up -d   # Umami
#   docker compose --profile proxy up -d       # Caddy on :80 (prod-like routing)
#   docker compose --profile backup up -d      # scheduled backups

x-backend: &backend
  image: anishows_web:dev
  build:
    context: .
    target: development
  env_file: .env
  environment:
    DJANGO_ENV: development
    DB_HOST: db
    DB_PORT: "5432"
    DB_CONN_MAX_AGE: "0"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    # Dev object storage: the rustfs service below (RustFS, S3-compatible).
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
    AWS_S3_ENDPOINT_URL: http://rustfs:9000
    S3_PUBLIC_DOMAIN: localhost:${FRONTEND_PORT:-5173}
  volumes:
    - .:/app
  user: "1000:1000"
  depends_on: &backend-deps
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    createbuckets:
      condition: service_completed_successfully

services:
  web:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec uvicorn root.asgi:application --host 0.0.0.0 --port 8000
        --reload --reload-dir apps --reload-dir root --reload-dir templates
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  celery:
    <<: *backend
    command: >
      celery -A root worker -l INFO --concurrency=2
      -Q critical,high_priority,default,notifications,batch,images,analytics,low_priority
    healthcheck:
      disable: true
    depends_on:
      <<: *backend-deps
      web:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A root beat -l INFO --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      <<: *backend-deps
      web:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_ENVIRONMENT: development
      # Vite proxies /media here (default in vite.config.js is the old minio name).
      DEV_MEDIA_TARGET: http://rustfs:9000
      VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-anishows_db}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anishows_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  # Object storage (RustFS, multi-arch). Production uses the RustFS already
  # running on the host instead; this one is for local development only.
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rustfs_data:/data

  # Creates the bucket and makes only its media/ prefix publicly readable
  # (GetObject, no listing), the same policy as production. Idempotent.
  createbuckets:
    image: rustfs/rc:v0.1.37@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_USER: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      S3_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-anishows-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rc alias set local http://rustfs:9000 "$${S3_USER}" "$${S3_PASSWORD}"
        rc mb -p "local/$${BUCKET_NAME}"
        # Not `rc anonymous set download`: that also allows listing the bucket.
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'"$${BUCKET_NAME}"'/media/*"]}]}' > /tmp/media-read.json
        rc anonymous set-json /tmp/media-read.json "local/$${BUCKET_NAME}"

  # -------------------------------------------------------------------- tests

  # `make test` (docker compose --profile test run --rm test). Uses its own
  # throwaway Postgres and no memory cap, independent of the dev services.
  test_db:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anishows_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anishows_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    profiles: [test]
    image: anishows_web:dev
    build:
      context: .
      target: development
    working_dir: /app
    command: ["python", "-m", "pytest"]
    volumes:
      - .:/app
      # Hide the dev .env (settings load it) so local runs match CI.
      - /dev/null:/app/.env:ro
    environment:
      DJANGO_SETTINGS_MODULE: root.settings.test
      DJANGO_SECRET_KEY: test-secret-key
      TEST_DB_HOST: test_db
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: anishows_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      USE_S3: "False"
    user: "1000:1000"
    depends_on:
      test_db:
        condition: service_healthy

  # ------------------------------------------------------------------ optional

  caddy:
    profiles: [proxy]
    image: caddy:alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    ports:
      - "80:80"
    environment:
      DOMAIN_NAME: http://localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - frontend

  umami_db:
    profiles: [analytics]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami_db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    depends_on:
      umami_db:
        condition: service_healthy

  backup:
    profiles: [backup]
    build: ./backups
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-anishows_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Media backups read the dev bucket over S3 (rclone).
      AWS_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-anishows-media}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    depends_on:
      - db
      - rustfs
    volumes:
      - ./backups-data:/backups

volumes:
  db_data:
  redis_data:
  rustfs_data:
  umami_db_data:
