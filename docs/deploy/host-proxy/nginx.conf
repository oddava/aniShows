# aniShows behind the host's existing nginx (proxy mode, CADDY_MODE=proxy).
#
# Drop into the host nginx's sites (e.g. /etc/nginx/conf.d/anishows.conf),
# point the certificate paths at the host's existing certificates, then
# `nginx -t && systemctl reload nginx`.
#
# What the app relies on (checked end to end with this file; DEPLOY.md,
# "Verified locally"):
#   - X-Forwarded-For APPENDS the client ($proxy_add_x_forwarded_for). Caddy
#     reads the header right to left and stops at the first untrusted address,
#     so a client cannot pick its own IP (throttles, the admin gate, logs).
#   - X-Forwarded-Proto is the scheme nginx saw. Without "https" here Django
#     redirects every request to https: a redirect loop.
#   - Host is passed through: Django checks it against ALLOWED_HOSTS.
#   - Upgrade/Connection for WebSockets (/ws/).
# Caddy listens on 127.0.0.1:8080 (CADDY_PROXY_BIND / CADDY_PROXY_PORT) and
# sees nginx as the Docker gateway of APP_SUBNET (10.250.250.1): that address
# is in CADDY_TRUSTED_PROXIES.

# Once per http {} block (skip it if the host config already defines it).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name anishows.com www.anishows.com;
    # Keep ACME http-01 here if the host's certificates use it.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anishows.com www.anishows.com;

    ssl_certificate     /etc/letsencrypt/live/anishows.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anishows.com/privkey.pem;

    # Caddy caps request bodies at 12 MB too (avatars, MAL XML imports).
    client_max_body_size 12m;

    # HSTS: Caddy and Django already send "max-age=31536000". If this server
    # adds its own Strict-Transport-Security, remove one of them.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long enough for the slowest API call (gunicorn's timeout is 60 s)
        # and for idle WebSockets between pings.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
