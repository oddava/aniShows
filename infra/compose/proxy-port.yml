# Proxy mode (CADDY_MODE=proxy, the default): an existing reverse proxy on
# this host (nginx, Caddy, Traefik...) terminates TLS and forwards to Caddy
# here, on the host's loopback only. Point it at
# http://127.0.0.1:${CADDY_PROXY_PORT}. deploy-prod.sh adds this file unless
# CADDY_PROXY_PUBLISH=0 (the proxy joins our network instead:
# shared-proxy-network.yml). Caddy sees these connections coming from the
# Docker gateway of APP_SUBNET (10.250.250.1 by default): that address goes
# in CADDY_TRUSTED_PROXIES.
services:
  caddy:
    ports:
      - "${CADDY_PROXY_BIND:-127.0.0.1}:${CADDY_PROXY_PORT:-8080}:80"
